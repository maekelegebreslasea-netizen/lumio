<body>
<div id="root"></div>
<script>
// Configure PDF.js worker
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

window.addEventListener('load',function(){
  try{ startLumio(); }
  catch(e){
    document.getElementById('root').innerHTML='<div style="padding:40px;text-align:center;font-family:sans-serif"><h2 style="color:#dc2626">Error: '+e.message+'</h2><p style="color:#6b7299;margin-top:8px">Please refresh the page</p></div>';
  }
});

function startLumio(){
const h=React.createElement;
const F=React.Fragment;
const{useState,useEffect,useRef,useCallback,useMemo}=React;

// -- CONFIG --
const SUPA=window.supabase.createClient(
  "https://jmsaceushtshgqulreyu.supabase.co",
  "sb_publishable_DCO2buENQ1j__8cN32TVTQ_miaroN4l"
);
const MODEL="claude-haiku-4-5-20251001";
const S={
  get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  del:k=>{try{localStorage.removeItem(k)}catch{}}
};
const uid=()=>Math.random().toString(36).slice(2,9);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// -- PDF TEXT EXTRACTION --
async function extractPdfText(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        if(!window.pdfjsLib){resolve("PDF text could not be extracted. Please paste the text manually.");return}
        const pdf=await pdfjsLib.getDocument({data:e.target.result}).promise;
        let text="";
        for(let i=1;i<=Math.min(pdf.numPages,50);i++){
          const page=await pdf.getPage(i);
          const content=await page.getTextContent();
          text+=content.items.map(item=>item.str).join(" ")+"\n";
        }
        resolve(text.trim()||"Could not extract text from this PDF. Please paste the text manually.");
      }catch(err){resolve("PDF error: "+err.message+". Please paste the text manually.")}
    };
    reader.onerror=()=>resolve("Could not read file. Please paste the text manually.");
    reader.readAsArrayBuffer(file);
  });
}

// -- FILE READER --
async function readMat(file){
  const kind=file.type.startsWith("image/")?"image":file.type==="application/pdf"?"pdf":"text";
  if(kind==="text"){
    return new Promise(res=>{const r=new FileReader();r.onload=e=>res({kind:"text",text:e.target.result,name:file.name});r.readAsText(file)});
  }
  if(kind==="pdf"){
    const text=await extractPdfText(file);
    return{kind:"text",text,name:file.name}; // Store as text after extraction
  }
  if(kind==="image"){
    // For images: store as base64 for AI analysis, max 4MB
    if(file.size>4*1024*1024)return{kind:"text",text:"Image too large. Please describe it in text instead.",name:file.name};
    return new Promise(res=>{
      const r=new FileReader();
      r.onload=e=>res({kind:"image",mimeType:file.type,b64:e.target.result.split(",")[1],name:file.name,text:""});
      r.readAsDataURL(file);
    });
  }
}

// -- VOICE --
let vList=[];
function loadVoices(){vList=window.speechSynthesis?.getVoices()||[]}
if(window.speechSynthesis){setTimeout(loadVoices,500);speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,gender){
  if(!window.speechSynthesis||!text)return;
  try{
    speechSynthesis.cancel();
    const clean=text.replace(/<[^>]+>/g,"").replace(/\*\*/g,"").replace(/[\u{1F300}-\u{1F9FF}]/gu,"").replace(/\s+/g," ").trim().slice(0,600);
    if(!clean)return;
    const u=new SpeechSynthesisUtterance(clean);
    if(vList.length===0)vList=speechSynthesis.getVoices();
    const en=vList.filter(v=>v.lang.startsWith("en"));
    u.voice=gender==="male"
      ?(en.find(v=>/male|david|mark|daniel|james/i.test(v.name))||en[1]||en[0])
      :(en.find(v=>/female|samantha|victoria|karen|susan/i.test(v.name))||en[0]);
    u.lang="en-US";u.rate=0.88;u.pitch=gender==="male"?0.8:1.1;u.volume=1;
    setTimeout(()=>{speechSynthesis.speak(u);if(speechSynthesis.paused)speechSynthesis.resume()},80);
  }catch(e){}
}

// -- API --
async function callAI(key,system,messages,tries=3){
  // Check for image content (must go direct to Anthropic)
  const hasImage=messages.some(m=>Array.isArray(m.content)&&m.content.some(c=>c.type==="image"));
  for(let i=0;i<tries;i++){
    try{
      let r;
      if(hasImage){
        r=await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
          body:JSON.stringify({model:MODEL,max_tokens:500,system,messages})
        });
      } else {
        r=await fetch("/.netlify/functions/chat",{
          method:"POST",
          headers:{"Content-Type":"application/json","x-api-key":key},
          body:JSON.stringify({model:MODEL,max_tokens:500,system,messages})
        });
      }
      if(r.status===429||r.status===529){if(i<tries-1){await sleep(8000*(i+1));continue}throw new Error("Too many requests. Wait 30 seconds and try again.")}
      if(r.status===401)throw new Error("Invalid API key. Update it in Profile.");
      if(!r.ok)throw new Error("Error "+r.status+". Try again.");
      const d=await r.json();
      if(d.error)throw new Error(d.error.message||"API error");
      return d.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    }catch(e){
      if(e.message.includes("requests")||e.message.includes("key")||e.message.includes("Error")||e.message.includes("Invalid"))throw e;
      if(i<tries-1){await sleep(2000);continue}
      throw e;
    }
  }
}

function parseJSON(raw){
  try{
    let s=raw.replace(/```json/gi,"").replace(/```/gi,"").trim();
    let start=s.indexOf("{");
    let start2=s.indexOf("[");
    if(start===-1&&start2===-1)return null;
    if(start===-1)start=start2;
    else if(start2!==-1&&start2<start)start=start2;
    s=s.slice(start);
    return JSON.parse(s);
  }catch{return null}
}
function hl(t){if(!t)return"";return t.replace(/\*\*(.*?)\*\*/g,'<strong style="color:#92400e">$1</strong>').replace(/\n/g,"<br/>")}

// -- DB --
const db={

// Build clean alternating history for API
function buildHist(msgs){
  const hist=[];
  for(const m of msgs){
    const role=m.role==="user"?"user":"assistant";
    if(hist.length>0&&hist[hist.length-1].role===role)continue;
    hist.push({role,content:m.text});
  }
  if(hist.length===0||hist[0].role!=="user")return null;
  return hist;
}

// -- MIC --
function useMic(onResult){
  const[on,setOn]=useState(false);
  const ref=useRef(null);
  const start=useCallback(()=>{
    if(on){try{ref.current?.stop()}catch{}setOn(false);return}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Voice input requires Chrome browser.");return}
    try{
      const r=new SR();ref.current=r;
      r.lang="en-US";r.continuous=false;r.interimResults=false;
      r.onstart=()=>setOn(true);
      r.onend=()=>setOn(false);
      r.onerror=e=>{setOn(false);if(e.error==="not-allowed")alert("Microphone blocked. Go to browser Settings and allow Microphone for this site.")};
      r.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript;setOn(false);if(t)onResult(t)};
      r.start();
    }catch(e){setOn(false)}
  },[on,onResult]);
  return[on,start];
}
