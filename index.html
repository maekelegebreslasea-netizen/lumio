function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

var voiceList=[];
function loadVoices(){voiceList=window.speechSynthesis?window.speechSynthesis.getVoices():[]}
if(window.speechSynthesis){
  setTimeout(loadVoices,600);
  window.speechSynthesis.onvoiceschanged=loadVoices;
}

function speak(text,gender,langCode,rate){
  if(!window.speechSynthesis||!text)return;
  try{
    window.speechSynthesis.cancel();
    var clean=text.replace(/<[^>]+>/g,"").replace(/\*\*/g,"").replace(/\s+/g," ").trim().slice(0,500);
    if(!clean)return;
    var u=new SpeechSynthesisUtterance(clean);
    if(voiceList.length===0)voiceList=window.speechSynthesis.getVoices();
    var targetLang=langCode||"en-US";
    var shortLang=targetLang.slice(0,2).toLowerCase();
    // Find voices matching the target language
    var langVoices=voiceList.filter(function(v){return v.lang.toLowerCase().startsWith(shortLang)});
    // Fall back to any voice if no match
    if(langVoices.length===0)langVoices=voiceList.filter(function(v){return v.lang.startsWith("en")});
    if(langVoices.length===0)langVoices=voiceList;
    // Pick gender
    var voice;
    if(gender==="male"){
      voice=langVoices.find(function(v){return /male|man|david|mark|daniel/i.test(v.name)})||langVoices[1]||langVoices[0];
    } else {
      voice=langVoices.find(function(v){return /female|woman|samantha|victoria|karen/i.test(v.name)})||langVoices[0];
    }
    if(voice)u.voice=voice;
    u.lang=voice?voice.lang:targetLang;
    u.rate=(rate||1)*0.9;u.pitch=gender==="male"?0.8:1.1;u.volume=1;
    setTimeout(function(){window.speechSynthesis.speak(u);if(window.speechSynthesis.paused)window.speechSynthesis.resume()},100);
  }catch(e){}
}

async function callAI(key,system,messages,tries){
  tries=tries||3;
  for(var i=0;i<tries;i++){
    try{
      var r=await fetch("/.netlify/functions/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key},
        body:JSON.stringify({model:MODEL,max_tokens:500,system:system,messages:messages})
      });
      if(r.status===429||r.status===529){
        if(i<tries-1){await sleep(8000*(i+1));continue}
        throw new Error("Too many requests. Wait 30 seconds.");
      }
      if(r.status===401)throw new Error("Invalid API key. Update in Profile.");
      if(!r.ok)throw new Error("Error "+r.status);
      var d=await r.json();
      if(d.error)throw new Error(d.error.message||"API error");
      return d.content.filter(function(b){return b.type==="text"}).map(function(b){return b.text}).join("");
    }catch(e){
      if(e.message.indexOf("requests")>-1||e.message.indexOf("key")>-1||e.message.indexOf("Error")>-1)throw e;
      if(i<tries-1){await sleep(2000);continue}
      throw e;
    }
  }
}

function parseJSON(raw){
  try{
    var s=raw.replace(/```json/gi,"").replace(/```/gi,"").trim();
    var i=s.indexOf("{");
    var i2=s.indexOf("[");
    if(i===-1&&i2===-1)return null;
    if(i===-1)i=i2;
    else if(i2!==-1&&i2<i)i=i2;
    return JSON.parse(s.slice(i));
  }catch(e){return null}
}

async function readTextFile(file){
  return new Promise(function(res){
    var r=new FileReader();
    r.onload=function(e){res(e.target.result)};
    r.readAsText(file);
  });
}

async function readPdfFile(file){
  if(!window.pdfjsLib)return"PDF could not be read. Please paste the text manually.";
  return new Promise(function(res){
    var r=new FileReader();
    r.onload=async function(e){
      try{
        var pdf=await pdfjsLib.getDocument({data:e.target.result}).promise;
        var text="";
        var pages=Math.min(pdf.numPages,50);
        for(var i=1;i<=pages;i++){
          var page=await pdf.getPage(i);
          var c=await page.getTextContent();
          text+=c.items.map(function(item){return item.str}).join(" ")+"\n";
        }
        res(text.trim()||"Could not extract text. Please paste manually.");
      }catch(err){res("PDF error. Please paste the text manually.")}
    };
    r.onerror=function(){res("Could not read file.")};
    r.readAsArrayBuffer(file);
  });
}

async function readMat(file){
  var isImg=file.type.startsWith("image/");
  var isPdf=file.type==="application/pdf";
  if(isImg){
    return new Promise(function(res){
      var r=new FileReader();
      r.onload=function(e){res({kind:"image",mimeType:file.type,b64:e.target.result.split(",")[1],name:file.name,text:""})};
      r.readAsDataURL(file);
    });
  }
  if(isPdf){
    var text=await readPdfFile(file);
    return{kind:"text",text:text,name:file.name};
  }
  var text=await readTextFile(file);
  return{kind:"text",text:text,name:file.name};
}

function matText(mats){

function buildHist(msgs){
  var hist=[];
  for(var i=0;i<msgs.length;i++){
    var m=msgs[i];
    var role=m.role==="user"?"user":"assistant";
    if(hist.length>0&&hist[hist.length-1].role===role){
      // Merge consecutive same-role messages
      hist[hist.length-1].content+=" "+m.text;
      continue;
    }
    hist.push({role:role,content:m.text});
  }
  // Must start with user
  while(hist.length>0&&hist[0].role!=="user")hist.shift();
  if(hist.length===0)return null;
  // Must end with user
  while(hist.length>0&&hist[hist.length-1].role!=="user")hist.pop();
  if(hist.length===0)return null;
  return hist;
}

function useMic(onResult,onLangCode){
  var mic=useState(false);
  var micOn=mic[0];var setMicOn=mic[1];
  var ref=useRef(null);
  var start=useCallback(function(){
    if(micOn){
      try{ref.current&&ref.current.stop()}catch(e){}
      setMicOn(false);return;
    }
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Voice input requires Chrome browser.");return}
    try{
      var r=new SR();ref.current=r;
      r.lang=onLangCode||"en-US";r.continuous=false;r.interimResults=false;
      r.onstart=function(){setMicOn(true)};
      r.onend=function(){setMicOn(false)};
      r.onerror=function(e){setMicOn(false);if(e.error==="not-allowed")alert("Microphone blocked. Allow it in browser settings.")};
      r.onresult=function(e){var t=e.results&&e.results[0]&&e.results[0][0]&&e.results[0][0].transcript;setMicOn(false);if(t)onResult(t)};
      r.start();
    }catch(e){setMicOn(false)}
  },[micOn,onResult]);
  return[micOn,start];
}
